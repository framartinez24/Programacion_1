<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="max-width: 450px; width: 100%;">
    <h3 class="text-center mb-3 brand-text">Crear Cuenta</h3>

    <!-- Conectamos el formulario a la función onRegister() de nuestro componente -->
    <form (ngSubmit)="onRegister()">
      <div class="mb-3">
        <label for="name" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Correo</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Teléfono</label>
        <input type="tel" class="form-control" id="phone" required>
      </div>
      <div class="mb-3">
        <label for="dob" class="form-label">Fecha de nacimiento</label>
        <input type="date" class="form-control" id="dob" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
        <input type="password" class="form-control" id="confirmPassword" required>
      </div>
      <!-- Aplicamos nuestra clase de botón naranja personalizada -->
      <button type="submit" class="btn btn-rotiya w-100">Registrarse</button>
    </form>
    <hr>
    <!-- Usamos routerLink para navegar de vuelta al login -->
    <p class="text-center">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
