<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card login-card p-4" style="max-width:420px;width:100%;">
    <!-- El título "Iniciar Sesión" usará la clase .brand-text que definimos en el SCSS -->
    <h3 class="text-center mb-3 brand-text">Iniciar Sesión</h3>

    @if (mostrarError) {
      <div class="alert alert-danger" role="alert">
        ❌ Credenciales incorrectas. Intenta nuevamente.
      </div>
    }

    <form (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label for="email" class="form-label">Correo o Teléfono</label>
        <input type="email" class="form-control" id="email" placeholder="usuario@mail.com" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <!--
        CAMBIO CLAVE: Reemplazamos 'btn-primary' por nuestra clase personalizada 'btn-rotiya'
      -->
      <button type="submit" class="btn btn-rotiya w-100">Iniciar sesión</button>
    </form>

    <div class="text-center mt-3">
      <a routerLink="/restore">¿Olvidaste la contraseña?</a>
    </div>
    <hr>
    <p class="text-center">¿No tienes una cuenta? <a routerLink="/registro">Regístrate</a></p>
  </div>
</div>
