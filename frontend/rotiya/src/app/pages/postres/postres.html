<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RotiYa - Postres</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h2 class="mb-4 text-center brand-text">Postres</h2>
   <!-- Panel categorías -->
  <app-menu-categories></app-menu-categories>

      <!-- Cards de Postres -->
      <div class="row g-4">
        <!-- Postre 1 -->
        <div class="col-md-4">
          <div class="card h-100 shadow-sm">
            <img
              src="https://www.paulinacocina.net/wp-content/uploads/2025/01/receta-de-cheesecake-1742898428.jpg.webp"
              class="card-img-top"
              alt="Cheesecake de frutos rojos"
            />
            <div class="card-body">
              <h5 class="card-title">Cheesecake de frutos rojos</h5>
              <p class="card-text">
                Base de galletas, crema suave y coulis de frutos del bosque.
              </p>
              <p class="text-success fw-bold">$6.99</p>
              <button class="btn btn-primary w-100 add-to-cart">Añadir</button>
            </div>
          </div>
        </div>

        <!-- Postre 2 -->
        <div class="col-md-4">
          <div class="card h-100 shadow-sm">
            <img
              src="https://s3-api-arcor.apps-webs.com/chocoaguila/archivos/recetas/receta-10100.webp"
              class="card-img-top"
              alt="Brownie con helado"
            />
            <div class="card-body">
              <h5 class="card-title">Brownie con helado</h5>
              <p class="card-text">
                Brownie tibio de chocolate con bocha de helado de vainilla.
              </p>
              <p class="text-success fw-bold">$5.50</p>
              <button class="btn btn-primary w-100 add-to-cart">Añadir</button>
            </div>
          </div>
        </div>

        <!-- Postre 3 -->
        <div class="col-md-4">
          <div class="card h-100 shadow-sm">
            <img
              src="https://vinomanos.com/wp-content/uploads/2020/04/Flan-casero-argentino.jpg.webp"
              class="card-img-top"
              alt="Flan casero"
            />
            <div class="card-body">
              <h5 class="card-title">Flan casero</h5>
              <p class="card-text">Clásico flan de vainilla con caramelo y crema.</p>
              <p class="text-success fw-bold">$4.20</p>
              <button class="btn btn-primary w-100 add-to-cart">Añadir</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
